# Runs the tests on every pull request into main and on every push to main.
# The live site only deploys a build by itself when this "tests" check passed (releases.py
# CHECK_NAME), so keep the workflow's and the job's name "tests".
name: tests
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: tests-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true
jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
      - name: A new version number
        if: github.event_name == 'pull_request'
        run: python tools/check_version.py origin/${{ github.base_ref }}
      - name: Every Python file compiles
        run: python -m compileall -q -x '(^|/)(venv|\.venv)/' .
      - name: The tests
        run: python run_tests.py
