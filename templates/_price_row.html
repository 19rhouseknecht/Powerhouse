{% set form_id = 'price-edit-' ~ item.id %}<tr id="price-item-{{ item.id }}" data-price-row="{{ item.id }}">
  <td class="price-select"><input type="checkbox" data-select-item value="{{ item.id }}" aria-label="Select {{ item.name }}"></td>
  <td class="price-image"><form id="{{ form_id }}" method="POST" action="{{ url_for('edit_price_item', item_id=item.id) }}" data-autosave><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><input type="hidden" name="notes" value="{{ item.notes }}"></form><form method="POST" action="{{ url_for('upload_price_item_image', item_id=item.id) }}" enctype="multipart/form-data" data-image-form><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="price-thumb {{ 'has-image' if item.image_path else '' }}" title="{{ 'Change picture' if item.image_path else 'Add a picture' }}">{% if item.image_path %}<img src="{{ url_for('static', filename=item.image_path) }}" alt="{{ item.name }}" loading="lazy">{% else %}<span aria-hidden="true">＋</span>{% endif %}<input type="file" name="image" accept="image/jpeg,image/png,image/gif,image/webp" class="sr-only" data-image-input aria-label="{{ 'Change' if item.image_path else 'Add' }} picture for {{ item.name }}"></label></form></td>
  <td><div class="price-name"><input form="{{ form_id }}" name="name" value="{{ item.name }}" required aria-label="Item name"><a href="{{ url_for('price_item_profile', item_id=item.id) }}" class="info-icon" data-profile title="Everything about this material" aria-label="Profile of {{ item.name }}">i</a></div>{% if item.notes %}<small>{{ item.notes }}</small>{% endif %}<span class="autosave-status" data-autosave-status aria-live="polite"></span></td>
  <td><input form="{{ form_id }}" name="category" value="{{ item.category }}" aria-label="Category"></td>
  <td><div class="supplier-part-list">{% for supplier_part in item.supplier_parts %}<div><input form="{{ form_id }}" name="supplier_name[]" value="{{ supplier_part.supplier }}" placeholder="Supplier" aria-label="Supplier"><input form="{{ form_id }}" name="supplier_part_number[]" value="{{ supplier_part.part_number }}" placeholder="Part #" aria-label="Part number"></div>{% endfor %}<div class="supplier-part-add"><input form="{{ form_id }}" name="supplier_name[]" placeholder="Add supplier" aria-label="Add supplier"><input form="{{ form_id }}" name="supplier_part_number[]" placeholder="Add part #" aria-label="Add part number"></div></div></td>
  <td><select form="{{ form_id }}" name="unit" aria-label="Unit">{% for value, label in [('ea','each'),('ft','per foot'),('roll','per roll'),('box','per box'),('lb','per pound'),('job','per job')] %}<option value="{{ value }}" {{ 'selected' if item.unit == value else '' }}>{{ label }}</option>{% endfor %}</select></td>
  <td><div class="money-input"><span>$</span><input form="{{ form_id }}" type="number" min="0" step="0.01" name="price" value="{{ '%.2f'|format(item.price) }}" aria-label="Material price"></div></td>
  <td><div class="labor-hours-input"><input form="{{ form_id }}" type="number" min="0" step="0.01" name="labor_hours_per_unit" value="{{ '%g'|format(item.labor_hours_per_unit) }}" aria-label="Labor hours per unit"><span>hr/{{ item.unit }}</span></div></td>
  <td><div class="service-usage-list">{% for service in item.linked_services %}<a href="{{ url_for('service_detail', service_id=service.id) }}">{{ service.name }}</a>{% else %}<span class="muted">Not used</span>{% endfor %}</div></td>
</tr>
