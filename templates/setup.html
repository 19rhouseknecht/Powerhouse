{% extends "base.html" %}
{% block title %}Set up — Power House Electrical Solutions{% endblock %}
{% block content %}
<div class="auth-card">
  <img src="{{ url_for('static', filename='img/logo-wordmark.png') }}" alt="Power House Electrical Solutions" class="auth-logo">
  <h1>Create the first account</h1>
  <p class="auth-subtitle">No users exist yet — set up the account you'll log in with. You can add your second team member from Settings once you're in.</p>

  <form method="POST" action="{{ url_for('setup') }}" class="auth-form">
    <label for="username">Username</label>
    <input type="text" id="username" name="username" value="{{ username }}" autofocus required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required minlength="8">

    <label for="confirm">Confirm password</label>
    <input type="password" id="confirm" name="confirm" required minlength="8">

    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>
</div>
{% endblock %}
