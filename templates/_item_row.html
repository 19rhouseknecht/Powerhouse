<div class="repeater-row item-row"><label class="grow item-name-field">Item<input type="hidden" name="item_price_id[]" value="{{ item.catalog_item.id if item is defined and item.catalog_item else '' }}"><input class="item-name-input" name="item_name[]" autocomplete="off" value="{{ item.current_name if item is defined else '' }}" placeholder="2 in. PVC conduit"><div class="price-suggestions"></div></label><label>Cooper part #<input class="item-cooper-input" name="item_cooper_part_number[]" value="{{ item.catalog_item.cooper_part_number if item is defined and item.catalog_item else '' }}" placeholder="Optional"></label><label>Qty.<input type="number" min="0" step="0.01" name="item_quantity[]" value="{{ '%g'|format(item.quantity) if item is defined else '1' }}"></label><label>Unit<input class="item-unit-input" name="item_unit[]" value="{{ item.current_unit if item is defined else 'ea' }}"></label><label>Unit price<input class="item-price-input" type="number" min="0" step="0.01" name="item_price[]" value="{{ '%.2f'|format(item.current_unit_price) if item is defined else '0.00' }}"></label><label class="grow">Notes<input name="item_notes[]" value="{{ item.notes if item is defined else '' }}" placeholder="Optional size or install note"></label><button type="button" class="remove-row" title="Remove row">×</button></div>
