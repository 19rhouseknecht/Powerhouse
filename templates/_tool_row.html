<div class="repeater-row tool-row"><label class="grow tool-name-field">Tool or equipment<input type="hidden" name="tool_id[]" value="{{ tool.catalog_tool.id if tool is defined and tool.catalog_tool else '' }}"><input class="tool-name-input" name="tool_name[]" autocomplete="off" value="{{ tool.current_name if tool is defined else '' }}" placeholder="Towable lift"><div class="tool-suggestions price-suggestions"></div></label><div class="tool-type-preview"><small>Type</small><strong>{{ tool.current_type if tool is defined else 'Select a tool' }}</strong>{% if tool is defined and tool.current_cost %}<span>${{ '{:,.2f}'.format(tool.current_cost) }} rental</span>{% endif %}</div><label class="grow">Crew note<input name="tool_notes[]" value="{{ tool.notes if tool is defined else '' }}" placeholder="Reserve before service date"></label><label class="critical-check"><input type="checkbox" name="tool_critical[]" value="ROW_INDEX" {{ 'checked' if tool is defined and tool.is_critical else '' }}><span>Don't forget</span></label><button type="button" class="remove-row" title="Remove row">×</button></div>
